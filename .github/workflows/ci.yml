name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otto
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/otto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - name: Migrations apply cleanly
        run: npm run db:migrate
      - name: Word bank loads
        run: npm run wordbank:load
      - name: Schema matches migrations
        run: |
          npx drizzle-kit generate
          test -z "$(git status --porcelain drizzle)" || (echo 'Schema changed without a migration: run npm run db:generate' && exit 1)
      - run: npm run build
